# Host nginx vhost for aranyavihaara.org.
#
# start.sh installs this to /etc/nginx/sites-available/aranyavihaara.org and
# symlinks it into sites-enabled, then hands it to `certbot --nginx`, which adds
# the ssl_certificate lines and the port-80 redirect itself — the same way every
# other site on this box is set up ("# managed by Certbot" comments).
#
# IMPORTANT: start.sh installs this file ONLY if it does not already exist, so
# certbot's edits are never clobbered on a re-run.

server {
    listen 80;
    listen [::]:80;
    server_name aranyavihaara.org www.aranyavihaara.org;

    # ~50KB of inline HTML/CSS/JS per page load.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/html;
    gzip_min_length 1024;

    location = /favicon.ico { access_log off; return 204; }

    # ---- Server-Sent Events. The app streams an infinite generator here. ----
    location = /api/stream {
        # One stream per tab is normal; 3 allows a couple of tabs, blocks abuse.
        limit_conn sse_conn 3;

        proxy_pass http://127.0.0.1:5020;

        proxy_http_version 1.1;
        # Empty, NOT "upgrade" — SSE is plain chunked HTTP/1.1, not a websocket.
        # HTTP/1.0 upstream would buffer the whole response to compute a
        # Content-Length, i.e. forever.
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;          # the one that actually matters
        proxy_cache off;
        proxy_request_buffering off;
        # Explicit because it is the classic silent killer: text/event-stream is
        # not in the default gzip_types, so SSE works today — but the moment
        # gzip_types grows to include text/*, the gzip filter buffers to fill a
        # deflate block and the stream stalls with no error anywhere.
        gzip off;
        chunked_transfer_encoding off;

        proxy_read_timeout 3600s;     # default 60s would kill the stream each minute
        proxy_send_timeout 3600s;
        send_timeout       3600s;
    }

    # This route fans out 8 concurrent requests to the government portal on EVERY
    # call, so it gets its own rate limit.
    location = /api/trek-calendar {
        limit_req zone=cal_req burst=5 nodelay;

        proxy_pass http://127.0.0.1:5020;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    location / {
        proxy_pass http://127.0.0.1:5020;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        # Short on purpose: a hang here means waitress thread starvation, and
        # failing fast beats holding the socket open.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
