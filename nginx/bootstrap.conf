# Bootstrap config — HTTP only, ZERO TLS directives, no dependency on the app.
#
# This exists to break the certbot chicken-and-egg: nginx refuses to start if
# ssl_certificate points at a file that does not exist yet, but certbot cannot
# obtain that file without an HTTP server already answering on port 80.
# start.sh installs this first, gets the certificate, then swaps in site.conf.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        default_type text/plain;
        return 200 "Provisioning certificates. Try again shortly.\n";
    }
}
