# Installed to /etc/nginx/conf.d/aranyavihaara-zones.conf
#
# limit_conn_zone / limit_req_zone are only valid at http{} level, and the vhost
# in sites-enabled is inside server{} — so the zones are declared here. The
# distinct "aranyavihaara" names keep this from colliding with any other site's
# zones on this shared nginx.

# One SSE stream per browser tab is normal; 3 permits a couple of tabs.
limit_conn_zone $binary_remote_addr zone=sse_conn:10m;

# /api/trek-calendar spawns an 8-thread fan-out at the government portal per
# request. Without this, N visitors clicking around = N x 8 uncontrolled
# concurrent hits on a .gov.in host.
limit_req_zone $binary_remote_addr zone=cal_req:10m rate=1r/s;
