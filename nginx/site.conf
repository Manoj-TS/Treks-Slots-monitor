# Production config. start.sh renders __DOMAIN__ and installs this as
# nginx/conf.d/default.conf once certificates exist.

# One SSE stream per tab is normal; 3 allows a couple of tabs and blocks abuse.
limit_conn_zone $binary_remote_addr zone=sse_conn:10m;

# /api/trek-calendar spawns a fresh 8-thread fan-out at the government portal on
# EVERY request. Without this, N visitors clicking around = N x 8 uncontrolled
# concurrent hits on a .gov.in host.
limit_req_zone $binary_remote_addr zone=cal_req:10m rate=1r/s;

# Docker's embedded DNS — required for the variable proxy_pass below.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # MUST stay above the redirect and reachable over plain HTTP forever, or
    # renewals fail silently and the site breaks 90 days later.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__ www.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # Inlined deliberately: options-ssl-nginx.conf is only created by certbot's
    # *nginx plugin*, and we issue with `certonly --webroot`. Including it would
    # make nginx fail to start.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Enable only once you are certain HTTPS works — browsers cache it hard.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # The page is ~50KB of inline HTML/CSS/JS, so this is a real win.
    # NOTE: text/event-stream is deliberately absent — see the SSE block.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/html;
    gzip_min_length 1024;

    client_max_body_size 1m;

    # A *variable* upstream forces per-request DNS re-resolution. With a literal
    # `proxy_pass http://app:5020;` nginx caches the container IP at startup and
    # serves 502 after every `docker compose up --build`.
    set $app_upstream "app:5020";

    location = /favicon.ico { access_log off; return 204; }

    # ---- SSE. Everything else in this file exists to keep this working. ----
    location = /api/stream {
        limit_conn sse_conn 3;

        proxy_pass http://$app_upstream$request_uri;

        proxy_http_version 1.1;
        # Empty, NOT "upgrade" — SSE is plain chunked HTTP/1.1, not a websocket.
        # HTTP/1.0 upstream would buffer the whole response to set Content-Length,
        # i.e. forever.
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;            # the one that actually matters
        proxy_cache off;
        proxy_request_buffering off;
        # Explicit because it is the classic silent killer: text/event-stream is
        # not in the default gzip_types, so SSE works today — but the moment
        # someone adds `gzip_types text/*` the gzip filter buffers to fill a
        # deflate block and the stream stalls with no error anywhere.
        gzip off;
        chunked_transfer_encoding off;

        proxy_read_timeout 3600s;       # default 60s would kill the stream each minute
        proxy_send_timeout 3600s;
        send_timeout       3600s;
    }

    # Rate-limited: this route fans out to the government portal per request.
    location = /api/trek-calendar {
        limit_req zone=cal_req burst=5 nodelay;

        proxy_pass http://$app_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    location / {
        proxy_pass http://$app_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        # Short on purpose: a hang here means waitress thread starvation, and
        # failing fast beats holding the socket open.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
