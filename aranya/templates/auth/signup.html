{% extends "auth/base.html" %}
{% block title %}Create an account · Aranya{% endblock %}
{% block content %}
<h2>Create an account</h2>
<div class="lead">We'll email you a link to confirm your address.</div>

{% with next_path = '' %}{% include "auth/_google.html" %}{% endwith %}

<form method="post" action="{{ url_for('auth.signup') }}">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <div class="fieldrow">
    <label class="fld" for="name">Name <span style="opacity:.6">(optional)</span></label>
    <input type="text" id="name" name="name" autocomplete="name">
  </div>
  <div class="fieldrow">
    <label class="fld" for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email or '' }}"
           autocomplete="email" required>
  </div>
  <div class="fieldrow">
    <label class="fld" for="password">Password</label>
    <input type="password" id="password" name="password"
           autocomplete="new-password" minlength="8" required>
  </div>
  <button class="btn" type="submit">Create account</button>
</form>

<div class="alt">
  Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
</div>
{% endblock %}
