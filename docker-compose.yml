name: aranyavihaara

services:
  app:
    build: .
    image: aranyavihaara-app:${GIT_SHA:-latest}
    container_name: av-app
    restart: unless-stopped
    # Bound to loopback only: this VPS already runs a host-level nginx serving
    # several sites, and that nginx reverse-proxies to us. Publishing on
    # 0.0.0.0 would expose the app directly, bypassing TLS — and Docker's
    # port rules sit in the DOCKER chain, which ufw does not filter.
    # Same pattern as the other apps on this box (acube-web, openhouse).
    ports:
      - "127.0.0.1:5020:5020"
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Kolkata
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 10s
